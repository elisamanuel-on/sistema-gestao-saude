[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# F (Pyflakes: erros lógicos, imports/variáveis não usadas), E9 (erros de
# sintaxe) e B (flake8-bugbear: bugs comuns e más práticas). É o mesmo
# conjunto que já corríamos manualmente com `ruff check --select=F,E9,B .`
# — este ficheiro só formaliza isso, para não ser preciso lembrar da flag
# (sem ele, o ruff usa o conjunto default, que traz avisos de estilo sem
# grande valor aqui, ex.: comprimento de linha).
select = ["F", "E9", "B"]
