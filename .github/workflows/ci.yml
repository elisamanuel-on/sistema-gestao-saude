name: CI

# Corre pytest e ruff em cada push e em cada pull request para o main. Não
# bloqueia o deploy no Render por si só (o Render continua a fazer
# auto-deploy a cada push), mas mostra um X vermelho no commit/PR assim que
# algo fica dessincronizado ou quebrado, em vez de só se descobrir quando o
# deploy falha em produção. É o mesmo tipo de erro que já aconteceu neste
# projeto (um ficheiro atualizado localmente mas esquecido do "git add").
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Python 3.11 (mesma versão do render.yaml)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: "ruff (regras em pyproject.toml: F, E9, B)"
        run: ruff check .

      - name: pytest
        run: pytest -v
